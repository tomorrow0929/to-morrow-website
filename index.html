<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // 旧URL（amplifyapp.com）で開かれたら、新しいドメインへ移します。
      // Amplifyコンソール側の301リダイレクトが本命で、これはその保険です。
      (function () {
        if (location.hostname.indexOf('.amplifyapp.com') !== -1) {
          location.replace(
            'https://to-morrow.net' + location.pathname + location.search + location.hash
          )
        }
      })()
    </script>

    <!-- ===== ファビコン（タブに出る小さいアイコン） =====
         public/ フォルダの中身は、そのままの名前で公開されます。
         差し替えたいときは public/ の中のファイルを入れ替えるだけでOK。

         パスは "/" 始まり（サイトのルート基準）にしています。
         "./" だと /about のような下の階層を開いたときに
         /about/favicon.svg を探しにいってしまい、見つからなくなるためです。
         ※ サブディレクトリ配下で公開する場合はここを "./" に戻してください。 -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#01545a" />

    <!-- ===== SEO / SNSシェア用 ===== -->
    <title>to.Morrow | ITで次の一歩を支援する、信頼のパートナー</title>
    <meta
      name="description"
      content="広島のITコンサルティング・システム開発。kintoneの業務システム構築、帳票作成代行、無料プラグインの配布、社内DX推進支援、Webサイト制作を行っています。"
    />
    <!-- ↓ 独自ドメインを設定したら、このURLを書き換えてください -->
    <link rel="canonical" href="https://to-morrow.net/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="to.Morrow" />
    <meta property="og:title" content="to.Morrow" />
    <meta
      property="og:description"
      content="ITで次の一歩を支援する、信頼のパートナー。kintoneの導入・帳票作成代行から、無料プラグインの配布まで。"
    />
    <meta property="og:url" content="https://to-morrow.net/" />
    <meta
      property="og:image"
      content="https://to-morrow.net/favicon-512x512.png"
    />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
{
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "to.Morrow",
      "url": "https://to-morrow.net/",
      "description": "広島のITコンサルティング・システム開発。kintoneの業務システム構築、帳票作成代行、無料プラグインの配布、社内DX推進支援、Webサイト制作を行っています。",
      "slogan": "ITで次の一歩を支援する、信頼のパートナー",
      "founder": {
        "@type": "Person",
        "name": "今井 渓"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "JP",
        "addressRegion": "広島県",
        "addressLocality": "広島市西区"
      },
      "areaServed": {
        "@type": "Country",
        "name": "日本"
      },
      "knowsAbout": [
        "kintone",
        "kintoneプラグイン開発",
        "帳票出力",
        "業務システム開発",
        "DX推進支援",
        "Webサイト制作"
      ],
      "sameAs": [
        "https://plugins.to-morrow.net/"
      ]
    }
    </script>
    <!-- アクセス計測（測定IDは public/analytics.js の1箇所） -->
    <script src="/analytics.js" defer></script>
  </head>
  <body>
    <!-- React はこの div の中に描画されます -->
    <div id="root"></div>

    <!--
      index.html をダブルクリックして開くと（file:// で開くと）、
      ブラウザは JSX を読み込めないため画面が真っ白になります。
      そのときだけ案内を出す、という小さな仕掛けです。
      通常のURL（http/https）で開いたときは何も表示されません。
    -->
    <div id="file-protocol-notice" hidden>
      <div style="font-family: sans-serif; max-width: 640px; margin: 15vh auto; padding: 24px; line-height: 1.8; color: #333;">
        <h1 style="font-size: 1.2rem; color: #004d99;">このファイルは直接開けません</h1>
        <p>
          このサイトは React で作られているため、<code>index.html</code> をダブルクリックしても表示されません。<br />
          ターミナルでプロジェクトのフォルダを開き、次のコマンドを実行してください。
        </p>
        <pre style="background: #f0f3f6; padding: 12px 16px; border-radius: 8px; overflow-x: auto;">npm run dev</pre>
        <p>
          表示された <strong>http://localhost:5173/</strong> をブラウザで開いてください。<br />
          完成品を確認したいときは <code>npm run build</code> のあとに <code>npm run preview</code> です。
        </p>
      </div>
    </div>
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('file-protocol-notice').hidden = false;
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
